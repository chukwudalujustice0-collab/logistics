<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Ceetify Logistics</title>

  <meta name="theme-color" content="#0b347c">

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#f5f7fb;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
    }

    .box{
      background:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
      max-width:350px;
    }

    h1{
      color:#0b347c;
      margin-bottom:10px;
    }

    p{
      color:#666;
      margin-bottom:20px;
    }

    button{
      background:#dc1f2f;
      color:white;
      border:none;
      padding:10px 20px;
      border-radius:20px;
      cursor:pointer;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>No Internet</h1>
  <p>Please check your connection and try again.</p>
  <button onclick="location.reload()">Retry</button>
</div>

</body>
</html>
