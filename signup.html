<!-- signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Create Account | Ceetify Logistics</title>
  <meta name="theme-color" content="#0b347c" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --red:#dc1f2f;
      --blue:#0b347c;
      --dark:#071f4f;
      --muted:#667085;
      --line:#e6ebf2;
      --text:#101828;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,sans-serif;
      min-height:100vh;
      background:linear-gradient(135deg,#ffffff,#f3f7ff,#fff2f3);
      color:var(--text);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:450px;
      background:white;
      border:1px solid var(--line);
      border-radius:24px;
      padding:26px;
      box-shadow:0 20px 55px rgba(7,31,79,.15);
    }

    .logo{
      text-align:center;
      margin-bottom:20px;
    }

    .logo img{
      width:78px;
      height:78px;
      border-radius:20px;
      object-fit:contain;
    }

    h1{
      color:var(--blue);
      margin:12px 0 5px;
      font-size:28px;
    }

    .logo p{
      margin:0;
      color:var(--muted);
      font-size:14px;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:bold;
      color:#344054;
      margin:13px 0 7px;
    }

    input{
      width:100%;
      padding:14px;
      border:1px solid var(--line);
      border-radius:14px;
      font-size:15px;
      outline:none;
    }

    input:focus{
      border-color:var(--blue);
    }

    .agree{
      display:flex;
      gap:10px;
      align-items:flex-start;
      margin-top:15px;
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
    }

    .agree input{
      width:auto;
      margin-top:3px;
    }

    .agree a{
      color:var(--red);
      font-weight:bold;
      text-decoration:none;
    }

    button{
      width:100%;
      border:0;
      border-radius:999px;
      padding:14px;
      margin-top:14px;
      font-weight:900;
      cursor:pointer;
      font-size:15px;
    }

    .btn-red{
      background:var(--red);
      color:white;
    }

    .btn-blue{
      background:var(--blue);
      color:white;
    }

    .msg{
      display:none;
      margin-top:14px;
      padding:12px;
      border-radius:14px;
      font-size:14px;
      line-height:1.5;
    }

    .msg.error{
      display:block;
      background:#fff1f3;
      color:#b42318;
      border:1px solid #ffd1d7;
    }

    .msg.success{
      display:block;
      background:#ecfdf3;
      color:#027a48;
      border:1px solid #abefc6;
    }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:15px;
      font-size:14px;
    }

    .row a{
      color:var(--blue);
      font-weight:bold;
      text-decoration:none;
    }

    .footer{
      text-align:center;
      margin-top:18px;
      font-size:14px;
      color:var(--muted);
    }
  </style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <div class="logo">
      <img src="/icons/icon-192.png" alt="Ceetify Logistics">
      <h1>Create Account</h1>
      <p>Join Ceetify Logistics to book and track deliveries.</p>
    </div>

    <form id="signupForm">
      <label>Full Name</label>
      <input id="fullName" type="text" placeholder="Enter your full name" required>

      <label>Phone Number</label>
      <input id="phone" type="tel" placeholder="08000000000" required>

      <label>Email Address</label>
      <input id="email" type="email" placeholder="Enter your email" required>

      <label>Password</label>
      <input id="password" type="password" placeholder="Create password" required minlength="6">

      <label>Confirm Password</label>
      <input id="confirmPassword" type="password" placeholder="Confirm password" required minlength="6">

      <div class="agree">
        <input id="agree" type="checkbox" required>
        <span>
          I agree to Ceetify Logistics
          <a href="terms.html">Terms</a>,
          <a href="privacy.html">Privacy Policy</a>, and
          <a href="policy.html">Company Policy</a>.
        </span>
      </div>

      <button class="btn-red" type="submit">Create Account</button>
    </form>

    <div id="message" class="msg"></div>

    <div class="row">
      <a href="index.html">Home</a>
      <a href="login.html">Already have account?</a>
    </div>

    <div class="footer">
      Ceetify Logistics<br>
      Powered by Ceetify Multi-Ventures Ltd
    </div>

  </div>
</div>

<script>
  const SUPABASE_URL = "https://vjopoldebuwcjjezqfum.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqb3BvbGRlYnV3Y2pqZXpxZnVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3OTUxNzcsImV4cCI6MjA5MzM3MTE3N30.EPDxfnsj50dryIt-aJsyqZynVTmUdS2n_fNjv1caj24";

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById("signupForm");
  const msg = document.getElementById("message");

  function showMessage(text, type = "error"){
    msg.textContent = text;
    msg.className = "msg " + type;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const agree = document.getElementById("agree").checked;

    if(password !== confirmPassword){
      showMessage("Password and confirm password do not match.");
      return;
    }

    if(!agree){
      showMessage("You must agree to the terms before creating an account.");
      return;
    }

    showMessage("Creating account...", "success");

    const { data, error } = await client.auth.signUp({
      email,
      password,
      options: {
        data: {
          full_name: fullName,
          phone: phone,
          role: "customer"
        }
      }
    });

    if(error){
      showMessage(error.message || "Signup failed. Please try again.");
      return;
    }

    const user = data.user;

    if(user){
      await client.from("profiles").upsert({
        id: user.id,
        full_name: fullName,
        phone: phone,
        email: email,
        role: "customer",
        status: "active",
        created_at: new Date().toISOString()
      });
    }

    showMessage("Account created successfully. Please login to continue.", "success");

    setTimeout(() => {
      location.href = "login.html";
    }, 1200);
  });

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("/service-worker.js").catch(console.error);
  }
</script>

</body>
</html>
