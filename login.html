<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login | Ceetify Logistics</title>
  <meta name="theme-color" content="#0b347c" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --red:#dc1f2f;
      --blue:#0b347c;
      --dark:#071f4f;
      --white:#fff;
      --soft:#f5f8ff;
      --text:#101828;
      --muted:#667085;
      --line:#e6ebf2;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#ffffff,#f3f7ff,#fff2f3);
      min-height:100vh;
      color:var(--text);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:white;
      border:1px solid var(--line);
      border-radius:24px;
      padding:26px;
      box-shadow:0 20px 55px rgba(7,31,79,.15);
    }

    .logo{
      text-align:center;
      margin-bottom:22px;
    }

    .logo img{
      width:78px;
      height:78px;
      border-radius:20px;
      object-fit:contain;
    }

    h1{
      margin:12px 0 5px;
      color:var(--blue);
      font-size:28px;
    }

    .logo p{
      margin:0;
      color:var(--muted);
      font-size:14px;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:bold;
      color:#344054;
      margin:14px 0 7px;
    }

    input{
      width:100%;
      padding:14px;
      border:1px solid var(--line);
      border-radius:14px;
      font-size:15px;
      outline:none;
    }

    input:focus{
      border-color:var(--blue);
    }

    button{
      width:100%;
      border:0;
      border-radius:999px;
      padding:14px;
      margin-top:14px;
      font-weight:900;
      cursor:pointer;
      font-size:15px;
    }

    .btn-red{
      background:var(--red);
      color:white;
    }

    .btn-blue{
      background:var(--blue);
      color:white;
    }

    .btn-light{
      background:#eef3ff;
      color:var(--blue);
    }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-top:14px;
      font-size:14px;
    }

    .row a{
      color:var(--red);
      text-decoration:none;
      font-weight:bold;
    }

    .msg{
      display:none;
      margin-top:14px;
      padding:12px;
      border-radius:14px;
      font-size:14px;
      line-height:1.5;
    }

    .msg.error{
      display:block;
      background:#fff1f3;
      color:#b42318;
      border:1px solid #ffd1d7;
    }

    .msg.success{
      display:block;
      background:#ecfdf3;
      color:#027a48;
      border:1px solid #abefc6;
    }

    .divider{
      text-align:center;
      color:var(--muted);
      margin:18px 0 6px;
      font-size:13px;
    }

    .footer{
      text-align:center;
      margin-top:18px;
      font-size:14px;
      color:var(--muted);
    }

    .footer a{
      color:var(--blue);
      font-weight:bold;
      text-decoration:none;
    }
  </style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <div class="logo">
      <img src="/icons/icon-192.png" alt="Ceetify Logistics">
      <h1>Welcome Back</h1>
      <p>Login to continue your delivery booking.</p>
    </div>

    <form id="loginForm">
      <label>Email Address</label>
      <input id="email" type="email" placeholder="Enter your email" required>

      <label>Password</label>
      <input id="password" type="password" placeholder="Enter your password" required>

      <button class="btn-red" type="submit">Login</button>
    </form>

    <button class="btn-blue" id="biometricBtn" type="button">
      Login with Biometric / Passkey
    </button>

    <div class="divider">Biometric works only after passkey setup is added.</div>

    <div id="message" class="msg"></div>

    <div class="row">
      <a href="index.html">Home</a>
      <a href="signup.html">Create Account</a>
    </div>

    <div class="footer">
      Ceetify Logistics<br>
      Powered by Ceetify Multi-Ventures Ltd
    </div>

  </div>
</div>

<script>
  const SUPABASE_URL = "https://vjopoldebuwcjjezqfum.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqb3BvbGRlYnV3Y2pqZXpxZnVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3OTUxNzcsImV4cCI6MjA5MzM3MTE3N30.EPDxfnsj50dryIt-aJsyqZynVTmUdS2n_fNjv1caj24";

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById("loginForm");
  const msg = document.getElementById("message");
  const biometricBtn = document.getElementById("biometricBtn");

  function showMessage(text, type = "error"){
    msg.textContent = text;
    msg.className = "msg " + type;
  }

  function getNextPage(){
    const params = new URLSearchParams(location.search);
    return params.get("next") || "home.html";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    showMessage("Logging in...", "success");

    const { data, error } = await client.auth.signInWithPassword({
      email,
      password
    });

    if(error){
      showMessage(error.message || "Login failed. Please check your details.");
      return;
    }

    showMessage("Login successful. Redirecting...", "success");

    setTimeout(() => {
      location.href = getNextPage();
    }, 700);
  });

  biometricBtn.addEventListener("click", async () => {
    if(!window.PublicKeyCredential){
      showMessage("Biometric login is not supported on this browser.");
      return;
    }

    showMessage(
      "Biometric/passkey button is ready, but secure biometric login needs backend passkey registration and verification before activation."
    );
  });

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("/service-worker.js").catch(console.error);
  }
</script>

</body>
</html>
